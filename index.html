<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout HTML5</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        header {
            background-color: #4A7C59;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        header h1 {
            padding-left: 50px;
            margin: 0;
            font-size: 1.8rem;
        }
        
        .content-wrapper {
            display: flex;
            flex: 1;
        }
        
        nav {
            width: 20%;
            background-color: #A0C878;
            padding: 20px;
            color: white;
        }
        
        iframe {
            width: 80%;
            border: none;
            height: calc(100vh - 70px);
        }
        
        a {
            display: block;
            margin: 10px 0;
            text-decoration: none;
            color: white;
            font-weight: 500;
        }
        
        a:hover {
            color: #2A4E3A;
            transform: translateX(5px);
            transition: transform 0.2s ease;
        }

        footer {
            background-color: #4A7C59;
            color: white;
            padding: 15px 30px;
            font-size: 0.9rem;
            margin-top: auto;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .footer-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }
        
        .footer-info p {
            margin: 0;
            opacity: 0.8;
        }
        
        .footer-links {
            display: flex;
            gap: 15px;
        }
        
        .footer-links a {
            color: white;
            font-size: 1.2rem;
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .footer-links a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <header>
        <h1>Tugas HTML5 Layout</h1>
    </header>

    <div class="content-wrapper">
        <nav>
            <h2>Menu</h2>
            <a href="content.html" target="ContentFrame">Beranda</a>
            <a href="profile.html" target="ContentFrame">Profil</a>
            <a href="contact.html" target="ContentFrame">Kontak</a>
        </nav>
        
        <iframe name="ContentFrame" src="content.html"></iframe>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-info">
                <h3>Rizal Hermawan</h3>
                <p>&copy; 2025, Tidak Dilindungi</p>
            </div>
            <div class="footer-links">
                <a href="https://wa.me/6285783770890"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="https://github.com/RizlH"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.instagram.com/rzl_hermwn?igsh=ZzNydTB3bmU5ZGJ0"><i class="fa-brands fa-instagram"></i></a>
                <a href="https://www.facebook.com/rizal.hermawan.90410"><i class="fa-brands fa-facebook"></i></a>
            </div>
        </div>
    </footer>
</body>
</html>
