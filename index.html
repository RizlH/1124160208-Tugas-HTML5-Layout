<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout HTML5</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        header {
            background-color: #4A7C59;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        header h1 {
            padding-left: 50px;
            margin: 0;
            font-size: 1.8rem;
        }
        
        .content-wrapper {
            display: flex;
            flex: 1;
        }
        
        nav {
            width: 20%;
            background-color: #A0C878;
            padding: 20px;
            color: white;
        }
        
        iframe {
            width: 75%;
            border: none;
            height: calc(100vh - 70px);
        }
        
        a {
            display: block;
            margin: 10px 0;
            text-decoration: none;
            color: white;
            font-weight: 500;
        }
        
        a:hover {
            color: #2A4E3A;
            transform: translateX(5px);
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>
    <header>
        <h1>Tugas HTML5 Layout</h1>
    </header>

    <div class="content-wrapper">
        <nav>
            <h2>Menu</h2>
            <a href="content.html" target="ContentFrame">Beranda</a>
            <a href="profile.html" target="ContentFrame">Profil</a>
            <a href="contact.html" target="ContentFrame">Kontak</a>
        </nav>
        
        <iframe name="ContentFrame" src="content.html"></iframe>
    </div>
</body>
</html>
